<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scisors</title>

    <script type="module" src="script.js" defer></script>
    <script type="module" src="script2.js" defer></script>
    <link rel="stylesheet" href="style.css">

    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sixtyfour:BLED,SCAN@0..100,-53..100&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">Rock Paper Scissors!</h1>
        </div>
        <div class="body">
            <div class="option">
                <button class="move-btn">Rock</button>
                <button class="move-btn">Paper</button>
                <button class="move-btn">Scissors</button>    
            </div>
            <div class="mid">
                <div class="top-mid">
                    <div class="user">
                        <h2 class="player-name">YOU</h2>
                        <img class="hand user-hand" src="" alt="">
                    </div>
                    <!-- <div class="vs">VS</div> -->
                    <div class="computer">
                        <h2 class="player-name">COM</h2>
                        <img class="hand com-hand" src="" alt="">
                    </div>
                </div>
                <div class="bottom-mid">
                    <h2 class="result"></h2>
                </div>
            </div>
            <div class="score-board">
                <div class="current">
                    <h2 class="score-title">Current Scores</h2>
                    <h3 class="user-pts-title">You:</h3>
                    <h3 class="user-pts">0</h3>
                    <h3 class="com-pts-title">Com:</h3>
                    <h3 class="com-pts">0</h3>
                </div>
                <div class="record"></div>
            </div>
        </div>
        <div class="footer">
            <h2>by me</h2>
        </div>
    </div>
</body>
</html>
